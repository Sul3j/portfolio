<div class="detail">

    <div *ngIf="loading" class="detail__state">
        <div class="detail__spinner"></div>
        <p>Ładowanie projektu...</p>
    </div>

    <div *ngIf="error" class="detail__state detail__state--error">
        <p>Nie znaleziono projektu.</p>
        <a [routerLink]="['/']" fragment="projects" class="detail__back">← Wróć do projektów</a>
    </div>

    <ng-container *ngIf="!loading && !error && project">
        <div class="detail__hero">
            <div class="container">
                <a [routerLink]="['/']" fragment="projects" class="detail__back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    Wszystkie projekty
                </a>

                <h1 class="detail__title">{{ project.title }}</h1>
                <p class="detail__lead">{{ project.short_description }}</p>

                <div class="detail__tech-list">
                    <span class="detail__tech-badge" *ngFor="let tech of project.technologies">{{ tech }}</span>
                </div>

                <div class="detail__actions">
                    <a *ngIf="project.preview_url" [href]="project.preview_url" class="detail__btn detail__btn--primary" target="_blank" rel="noopener">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        Live demo
                    </a>
                    <a *ngIf="project.github_url" [href]="project.github_url" class="detail__btn detail__btn--secondary" target="_blank" rel="noopener">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
                        </svg>
                        Kod źródłowy
                    </a>
                </div>
            </div>
        </div>

        <div class="detail__body container">
            <div class="detail__content">
                <markdown [data]="project.content" class="detail__markdown"></markdown>
            </div>

            <div class="detail__gallery" *ngIf="project.images.length > 0">
                <h2 class="detail__gallery-heading">Zrzuty ekranu</h2>
                <div class="detail__gallery-grid">
                    <div class="detail__gallery-item" *ngFor="let img of project.images" (click)="openLightbox(img.image)">
                        <img [src]="img.image" [alt]="img.caption || project.title" loading="lazy" />
                        <div class="detail__gallery-overlay">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                <line x1="11" y1="8" x2="11" y2="14"></line>
                                <line x1="8" y1="11" x2="14" y2="11"></line>
                            </svg>
                        </div>
                        <p class="detail__gallery-caption" *ngIf="img.caption">{{ img.caption }}</p>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>

    <div class="detail__lightbox" *ngIf="activeImage" (click)="closeLightbox()">
        <button class="detail__lightbox-close" (click)="closeLightbox()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <img [src]="activeImage" alt="Podgląd" (click)="$event.stopPropagation()" />
    </div>

    <app-footer></app-footer>
</div>
